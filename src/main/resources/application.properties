spring.application.name=bodegacontrol-backend
server.port=8080

# Perfil activo: mysql (por defecto) o h2 (base en memoria, sin instalar nada)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# JWT
app.jwt.secret=${JWT_SECRET:BodegaControl-UPN-2026-clave-secreta-para-firmar-tokens-JWT-HS256}
app.jwt.expiration-seconds=28800

# CORS: origen del frontend Angular
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
